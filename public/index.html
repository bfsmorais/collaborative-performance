<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaborative Performance — Entrar</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B1426'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23F4C842'/%3E%3Ccircle cx='6' cy='8' r='1.5' fill='%23F4C842'/%3E%3Ccircle cx='26' cy='10' r='1.5' fill='%23E8EBF2'/%3E%3Ccircle cx='8' cy='25' r='1.5' fill='%23E8EBF2'/%3E%3Ccircle cx='25' cy='24' r='1.5' fill='%23F4C842'/%3E%3Cline x1='16' y1='16' x2='6' y2='8' stroke='%23B4BFD4' stroke-width='0.5' opacity='0.4'/%3E%3Cline x1='16' y1='16' x2='26' y2='10' stroke='%23B4BFD4' stroke-width='0.5' opacity='0.4'/%3E%3Cline x1='16' y1='16' x2='8' y2='25' stroke='%23B4BFD4' stroke-width='0.5' opacity='0.4'/%3E%3Cline x1='16' y1='16' x2='25' y2='24' stroke='%23B4BFD4' stroke-width='0.5' opacity='0.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <header class="auth-header">
      <h1>Collaborative Performance</h1>
      <p class="muted">Uma rede musical em crescimento</p>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="login" role="tab">Entrar</button>
      <button class="tab" data-tab="register" role="tab">Registar</button>
    </nav>

    <section id="login-pane" class="pane">
      <form id="login-form">
        <label>
          Email
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label>
          Password
          <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn-primary">Entrar</button>
        <p class="error" id="login-error" hidden></p>
      </form>
    </section>

    <section id="register-pane" class="pane" hidden>
      <form id="register-form">
        <label>
          Nome de utilizador
          <input type="text" name="username" required minlength="3" autocomplete="username">
        </label>
        <label>
          Email
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label>
          Password
          <input type="password" name="password" required minlength="6" autocomplete="new-password">
        </label>
        <button type="submit" class="btn-primary">Criar conta</button>
        <p class="error" id="register-error" hidden></p>
        <p class="success" id="register-success" hidden></p>
      </form>
    </section>

    <footer class="auth-footer">
      <p class="muted small">Social &amp; Collaborative Computing · MEI · UC · 2025/2026</p>
    </footer>
  </main>

  <script type="module" src="js/notes-rain.js"></script>
  <script type="module">
    import { login, register, getCurrentUser } from './js/auth.js';

    (async () => {
      const user = await getCurrentUser();
      if (user) window.location.href = 'app.html';
    })();

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        document.getElementById('login-pane').hidden = target !== 'login';
        document.getElementById('register-pane').hidden = target !== 'register';
      });
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('login-error');
      errEl.hidden = true;
      const fd = new FormData(e.target);
      try {
        await login(fd.get('email'), fd.get('password'));
        window.location.href = 'app.html';
      } catch (err) {
        errEl.textContent = err.message || 'Erro ao entrar';
        errEl.hidden = false;
      }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('register-error');
      const okEl = document.getElementById('register-success');
      errEl.hidden = true;
      okEl.hidden = true;
      const fd = new FormData(e.target);
      try {
        await register(fd.get('email'), fd.get('password'), fd.get('username'));
        okEl.textContent = 'Conta criada. Pode entrar agora.';
        okEl.hidden = false;
        e.target.reset();
      } catch (err) {
        errEl.textContent = err.message || 'Erro ao registar';
        errEl.hidden = false;
      }
    });
  </script>
</body>
</html>
